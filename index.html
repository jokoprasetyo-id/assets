<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AsetGo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: '#0ea5e9', // Sky 500
                        success: '#10b981', // Emerald 500
                        warning: '#f59e0b', // Amber 500
                        danger: '#ef4444', // Red 500
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            @apply bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 transition-colors duration-500;
            overflow-x: hidden;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        html.dark body {
            background-image: radial-gradient(#334155 1.5px, transparent 1.5px);
        }

        /* Komponen Minimalis Tegas */
        .minimal-card {
            @apply bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-[2rem] shadow-sm;
        }
        
        .minimal-input {
            @apply bg-slate-50 dark:bg-slate-950 border-2 border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-3 outline-none focus:border-accent focus:ring-4 focus:ring-accent/10 transition-all w-full font-medium text-slate-800 dark:text-slate-200;
        }

        .btn-icon {
            @apply bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 w-12 h-12 rounded-[1.25rem] flex items-center justify-center text-slate-600 dark:text-slate-400 hover:text-accent dark:hover:text-accent hover:border-accent transition-all cursor-pointer shadow-sm;
        }

        /* Sensor Privasi */
        body.privacy-on input.mask-data {
            -webkit-text-security: disc;
            color: #94a3b8;
            letter-spacing: 2px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-slate-700 rounded-full; }

        /* Goal Card Collapse Animation */
        .goal-body {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .goal-body > div { 
            min-height: 0; /* FIX UNTUK MEMPERLANCAR EFEK COLLAPSE */
            overflow: hidden; 
            opacity: 1;
            transition: opacity 0.3s ease-in-out, transform 0.4s ease-in-out;
            transform: translateY(0);
        }
        .is-collapsed .goal-body { grid-template-rows: 0fr; }
        .is-collapsed .goal-body > div {
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
        }
        .is-collapsed .btn-collapse { transform: rotate(180deg); }
    </style>
</head>
<body class="antialiased pb-20 lg:pb-8">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Fungsi Custom Dialog
        const showDialog = (title, message, type = 'alert', onConfirm = null) => {
            const dialog = document.getElementById('custom-dialog');
            const panel = document.getElementById('custom-dialog-panel');
            const icon = document.getElementById('custom-dialog-icon');
            
            document.getElementById('custom-dialog-title').textContent = title;
            document.getElementById('custom-dialog-message').textContent = message;
            
            const actions = document.getElementById('custom-dialog-actions');
            actions.innerHTML = '';
            
            if (type === 'confirm' || type === 'danger') {
                icon.innerHTML = type === 'danger' ? `<i data-lucide="alert-triangle" class="w-6 h-6"></i>` : `<i data-lucide="help-circle" class="w-6 h-6"></i>`;
                icon.className = type === 'danger' ? 'w-12 h-12 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center mb-4 dark:bg-red-500/20 dark:text-red-400' : 'w-12 h-12 rounded-2xl bg-warning/10 text-warning flex items-center justify-center mb-4';

                const btnCancel = document.createElement('button');
                btnCancel.className = 'px-4 py-2.5 rounded-xl font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition';
                btnCancel.textContent = 'Batal';
                btnCancel.onclick = () => closeDialog();
                
                const btnOk = document.createElement('button');
                const okColor = type === 'danger' ? 'bg-red-500 hover:bg-red-600' : 'bg-accent hover:opacity-90';
                btnOk.className = `px-4 py-2.5 rounded-xl font-bold text-white transition ${okColor}`;
                btnOk.textContent = 'Ya, Lanjutkan';
                btnOk.onclick = () => { closeDialog(); if(onConfirm) onConfirm(); };
                
                actions.appendChild(btnCancel);
                actions.appendChild(btnOk);
            } else {
                icon.innerHTML = `<i data-lucide="info" class="w-6 h-6"></i>`;
                icon.className = 'w-12 h-12 rounded-2xl bg-accent/10 text-accent flex items-center justify-center mb-4';
                const btnOk = document.createElement('button');
                btnOk.className = 'px-5 py-2.5 rounded-xl font-bold bg-accent text-white hover:opacity-90 transition';
                btnOk.textContent = 'Mengerti';
                btnOk.onclick = () => closeDialog();
                actions.appendChild(btnOk);
            }
            
            window.lucide.createIcons();
            dialog.classList.remove('hidden');
            setTimeout(() => {
                dialog.classList.remove('opacity-0');
                panel.classList.remove('scale-95');
                panel.classList.add('scale-100');
            }, 10);
        };

        const closeDialog = () => {
            const dialog = document.getElementById('custom-dialog');
            const panel = document.getElementById('custom-dialog-panel');
            dialog.classList.add('opacity-0');
            panel.classList.remove('scale-100');
            panel.classList.add('scale-95');
            setTimeout(() => dialog.classList.add('hidden'), 300);
        };

        const FB = {
            apiKey: "AIzaSyDKUSL_DSRjORdxpLsahxLamOluOLIQss8",
            authDomain: "assets-liquid.firebaseapp.com",
            projectId: "assets-liquid",
            storageBucket: "assets-liquid.firebasestorage.app"
        };
        const fbApp = initializeApp(FB);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let syncListener = null;

        // Mendukung multi-valas via Live API
        let EXCHANGE_RATES = {
            'IDR / Tabungan': 1, 'Saham (IDR)': 1, 'Reksadana (IDR)': 1, 'Obligasi (IDR)': 1,
            'Kripto (IDR)': 1, 'Properti (IDR)': 1, 'USD': 15000, 'SGD': 11800, 'EUR': 16500, 'AUD': 10500, 'JPY': 105,
            'Emas Antam (g)': 1400000, 'Emas G24 (g)': 1400000, 'Dinar KR': 4500000
        };

        const UNITS = Object.keys(EXCHANGE_RATES);
        const ICONS = { 'IDR / Tabungan': 'landmark', 'Saham (IDR)': 'trending-up', 'Reksadana (IDR)': 'pie-chart', 'Obligasi (IDR)': 'scroll-text', 'Kripto (IDR)': 'bitcoin', 'Properti (IDR)': 'home', 'USD': 'dollar-sign', 'SGD': 'banknote', 'EUR': 'euro', 'AUD': 'circle-dollar-sign', 'JPY': 'japanese-yen', 'Emas Antam (g)': 'coins', 'Emas G24 (g)': 'coins', 'Dinar KR': 'circle-dot' };

        const getTodayMonthStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
        const formatMonthLabel = (yyyy_mm) => {
            const [y, m] = yyyy_mm.split('-'); const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
            return `${months[parseInt(m)-1]} ${y}`;
        };

        let currentMonthStr = getTodayMonthStr();
        let trendChartInstance = null;
        
        let state = {
            theme: 'light', privacy: false,
            rates: { 'Emas Antam (g)': 1400000, 'Emas G24 (g)': 1400000, 'Dinar KR': 4500000 },
            history: {} 
        };

        const loadLocalData = () => {
            const saved = localStorage.getItem('liquid_assets_v4');
            if (saved) { try { let parsed = JSON.parse(saved); if(parsed.history) state = parsed; } catch(e){} }

            if (!state.history[currentMonthStr]) {
                state.history[currentMonthStr] = { lastUpdated: Date.now(), netWorth: 0, totalAssets: 0, debt: 0, goals: [{ id: 1, name: 'Dana Darurat', target: 50000000, collapsed: false, assets: [{ id: 101, name: 'Kas Rekening', unit: 'IDR / Tabungan', amount: 12500000 }] }] };
            }
            if (state.history[currentMonthStr].debt === undefined) state.history[currentMonthStr].debt = 0;

            EXCHANGE_RATES['Emas Antam (g)'] = state.rates['Emas Antam (g)'];
            EXCHANGE_RATES['Emas G24 (g)'] = state.rates['Emas G24 (g)'];
            EXCHANGE_RATES['Dinar KR'] = state.rates['Dinar KR'];

            document.getElementById('month-filter').value = currentMonthStr;
            document.documentElement.className = state.theme === 'light' ? 'light' : 'dark';
            document.body.classList.toggle('privacy-on', state.privacy);
            
            setTimeout(() => { window.lucide.createIcons(); }, 100);
        };

        const saveSilentLocalOnly = () => localStorage.setItem('liquid_assets_v4', JSON.stringify(state));
        const saveSilent = () => { saveSilentLocalOnly(); if(currentUser) setDoc(doc(db, 'liquid_assets_users', currentUser.uid), { state }, { merge: true }).catch(()=>{}); };
        const saveAndRender = () => { state.history[currentMonthStr].lastUpdated = Date.now(); saveSilent(); renderUI(); };

        loadLocalData();

        document.getElementById('btn-login').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => {
                if (err.code === 'auth/unauthorized-domain') {
                    showDialog('Domain Tidak Diizinkan', 'Sistem keamanan Firebase memblokir login dari domain ini. Silakan tambahkan URL web preview ini ke daftar "Authorized Domains" di Firebase Console Anda.', 'alert');
                } else {
                    showDialog('Gagal Login', err.message, 'alert');
                }
            });
        });

        document.getElementById('up-logout').addEventListener('click', () => {
            showDialog('Keluar Akun', 'Yakin ingin keluar dari sinkronisasi awan? Data lokal Anda akan tetap aman di perangkat ini.', 'confirm', () => signOut(auth));
        });

        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                document.getElementById('user-logged-out').classList.add('hidden');
                document.getElementById('user-logged-in').classList.remove('hidden');
                document.getElementById('up-avatar').src = user.photoURL || '';
                document.getElementById('up-name').textContent = user.displayName || 'Pengguna';
                document.getElementById('up-email').textContent = user.email || '';
                
                syncListener = onSnapshot(doc(db, 'liquid_assets_users', currentUser.uid), (docSnap) => {
                    if (docSnap.metadata.hasPendingWrites) return; 
                    if (docSnap.exists() && docSnap.data().state) {
                        state = docSnap.data().state;
                        if (!state.history[currentMonthStr]) state.history[currentMonthStr] = { lastUpdated: Date.now(), netWorth: 0, totalAssets: 0, debt: 0, goals: [] };
                        saveSilentLocalOnly(); renderUI(); 
                    } else saveSilent();
                });
            } else {
                currentUser = null;
                if (syncListener) { syncListener(); syncListener = null; } 
                document.getElementById('user-logged-out').classList.remove('hidden');
                document.getElementById('user-logged-in').classList.add('hidden');
            }
        });

        async function fetchLiveRates() {
            const statusEl = document.getElementById('live-fx-status');
            try {
                // Fetch base USD
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const data = await res.json();
                
                const idrRate = data.rates.IDR; // 1 USD = xxx IDR
                
                EXCHANGE_RATES['USD'] = idrRate;
                EXCHANGE_RATES['SGD'] = idrRate / data.rates.SGD;
                EXCHANGE_RATES['EUR'] = idrRate / data.rates.EUR;
                EXCHANGE_RATES['AUD'] = idrRate / data.rates.AUD;
                EXCHANGE_RATES['JPY'] = idrRate / data.rates.JPY;

                statusEl.innerHTML = `
                    <div class="flex items-center gap-2 mb-2">
                        <i data-lucide="check-circle-2" class="w-5 h-5 text-success"></i> 
                        <span class="text-success font-bold text-[13px] tracking-tight">Tersinkronisasi (Live)</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 w-full">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-2 text-center shadow-sm">
                            <div class="text-[10px] font-bold text-slate-400">USD</div>
                            <div class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Rp ${Math.round(EXCHANGE_RATES['USD']).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-2 text-center shadow-sm">
                            <div class="text-[10px] font-bold text-slate-400">SGD</div>
                            <div class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Rp ${Math.round(EXCHANGE_RATES['SGD']).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-2 text-center shadow-sm">
                            <div class="text-[10px] font-bold text-slate-400">EUR</div>
                            <div class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Rp ${Math.round(EXCHANGE_RATES['EUR']).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-2 text-center shadow-sm">
                            <div class="text-[10px] font-bold text-slate-400">AUD</div>
                            <div class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Rp ${Math.round(EXCHANGE_RATES['AUD']).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-2 text-center shadow-sm">
                            <div class="text-[10px] font-bold text-slate-400">JPY</div>
                            <div class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Rp ${Math.round(EXCHANGE_RATES['JPY']).toLocaleString('id-ID')}</div>
                        </div>
                    </div>
                `;
                window.lucide.createIcons();
                updateDynamicValues();
            } catch (err) {
                statusEl.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i data-lucide="wifi-off" class="w-5 h-5 text-slate-400"></i> 
                        <span class="text-slate-500 font-medium text-sm">Gagal mengambil data Live API (Offline)</span>
                    </div>
                `;
                window.lucide.createIcons();
            }
        }
        
        // Panggil saat aplikasi dimuat
        fetchLiveRates();

        document.getElementById('month-filter').addEventListener('change', (e) => {
            if (!e.target.value) return;
            currentMonthStr = e.target.value;
            if (!state.history[currentMonthStr]) {
                const past = Object.keys(state.history).filter(m => m < currentMonthStr).sort().reverse();
                let cGoals = [], cDebt = 0;
                if (past.length > 0) { cGoals = JSON.parse(JSON.stringify(state.history[past[0]].goals)); cDebt = state.history[past[0]].debt || 0; }
                state.history[currentMonthStr] = { lastUpdated: Date.now(), netWorth: 0, totalAssets: 0, debt: cDebt, goals: cGoals };
            }
            saveAndRender();
        });

        document.getElementById('btn-theme').addEventListener('click', () => {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            document.documentElement.className = state.theme;
            document.getElementById('theme-icon').setAttribute('data-lucide', state.theme === 'light' ? 'moon' : 'sun');
            window.lucide.createIcons(); renderTrendChart(); saveSilent();
        });

        document.getElementById('btn-privacy').addEventListener('click', () => {
            state.privacy = !state.privacy;
            document.body.classList.toggle('privacy-on', state.privacy);
            document.getElementById('btn-privacy').innerHTML = `<i data-lucide="${state.privacy ? 'eye-off' : 'eye'}"></i>`;
            window.lucide.createIcons(); saveSilent();
            updateDynamicValues(); // Force update teks bintang
        });

        // Toggle Floating Settings Modal
        const toggleSettingsModal = (show) => {
            const modal = document.getElementById('settings-modal');
            const panel = document.getElementById('settings-modal-panel');
            
            if (show) {
                document.getElementById('set-antam').value = state.rates['Emas Antam (g)'].toLocaleString('id-ID');
                document.getElementById('set-emas').value = state.rates['Emas G24 (g)'].toLocaleString('id-ID');
                document.getElementById('set-dinar').value = state.rates['Dinar KR'].toLocaleString('id-ID');
                
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    panel.classList.remove('scale-95');
                    panel.classList.add('scale-100');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                panel.classList.remove('scale-100');
                panel.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        };

        document.getElementById('btn-settings').addEventListener('click', () => toggleSettingsModal(true));
        document.getElementById('close-settings').addEventListener('click', () => toggleSettingsModal(false));

        ['set-antam', 'set-emas', 'set-dinar'].forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                let raw = this.value.replace(/\D/g, '');
                if (!raw) { this.value = ''; return; }
                let num = parseInt(raw, 10);
                this.value = num.toLocaleString('id-ID');
                let key = id === 'set-antam' ? 'Emas Antam (g)' : (id === 'set-emas' ? 'Emas G24 (g)' : 'Dinar KR');
                state.rates[key] = num; EXCHANGE_RATES[key] = num;
                saveSilent(); updateDynamicValues();
            });
        });

        document.getElementById('input-debt').addEventListener('input', function() {
            let raw = this.value.replace(/\D/g, '');
            if (!raw) { this.value = ''; state.history[currentMonthStr].debt = 0; }
            else { let num = parseInt(raw, 10); this.value = num.toLocaleString('id-ID'); state.history[currentMonthStr].debt = num; }
            state.history[currentMonthStr].lastUpdated = Date.now(); saveSilent(); updateDynamicValues();
        });

        document.getElementById('chart-metric-select').addEventListener('change', () => renderTrendChart());

        const renderTrendChart = () => {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const months = Object.keys(state.history).sort();
            const labels = months.map(formatMonthLabel);
            const metric = document.getElementById('chart-metric-select').value;
            
            const dataPoints = months.map(m => {
                if(metric === 'netWorth') return state.history[m].netWorth || 0;
                if(metric === 'assets') return state.history[m].totalAssets || 0;
                if(metric === 'debt') return state.history[m].debt || 0;
                return 0;
            });

            const isLight = state.theme === 'light';
            const colorLine = metric === 'debt' ? '#ef4444' : (metric === 'assets' ? '#10b981' : '#0ea5e9');
            const colorFill = metric === 'debt' ? 'rgba(239, 68, 68, 0.1)' : (metric === 'assets' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(14, 165, 233, 0.1)');

            if (trendChartInstance) trendChartInstance.destroy();

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ data: dataPoints, borderColor: colorLine, backgroundColor: colorFill, borderWidth: 3, pointBackgroundColor: isLight ? '#fff' : '#0f172a', pointBorderColor: colorLine, pointBorderWidth: 2, pointRadius: 4, fill: true, tension: 0.4 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => 'Rp ' + c.parsed.y.toLocaleString('id-ID') } } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: isLight ? '#64748b' : '#94a3b8', font: {family: 'Outfit', size: 10} } },
                        y: { border: {display: false}, grid: { color: isLight ? '#f1f5f9' : '#1e293b' }, ticks: { color: isLight ? '#64748b' : '#94a3b8', font: {family: 'Outfit', size: 10}, callback: v => (v/1000000) + ' Jt' } }
                    }
                }
            });
        };

        const updateDynamicValues = () => {
            const formatRp = (val) => state.privacy ? 'Rp *******' : `Rp ${Math.round(val).toLocaleString('id-ID')}`;
            const formatEq = (val) => state.privacy ? '≈ Rp *******' : `≈ Rp ${Math.round(val).toLocaleString('id-ID')}`;

            let totalAssets = 0;
            let diversData = {};
            const goals = state.history[currentMonthStr].goals;

            goals.forEach((goal, gIdx) => {
                let goalTotal = 0;
                goal.assets.forEach((a, aIdx) => {
                    const rate = EXCHANGE_RATES[a.unit] || 1;
                    const idrVal = a.amount * rate;
                    goalTotal += idrVal;
                    if(!diversData[a.unit]) diversData[a.unit] = 0;
                    diversData[a.unit] += idrVal;

                    const eq = document.getElementById(`equiv-${gIdx}-${aIdx}`);
                    if(eq) eq.textContent = a.unit.includes('IDR') ? '' : formatEq(idrVal);
                });
                totalAssets += goalTotal;

                const target = goal.target || 0;
                let pct = target > 0 ? (goalTotal / target) * 100 : 0;
                if(pct > 100) pct = 100;

                const pb = document.getElementById(`prog-${gIdx}`);
                const pt = document.getElementById(`pct-txt-${gIdx}`);
                const coll = document.getElementById(`col-txt-${gIdx}`);
                if(pb) pb.style.width = `${pct}%`;
                if(pt) pt.textContent = `${Math.round(pct)}%`;
                if(coll) coll.textContent = `Terkumpul: ${formatRp(goalTotal)}`;
            });

            const debt = state.history[currentMonthStr].debt || 0;
            const netWorth = totalAssets - debt;
            state.history[currentMonthStr].netWorth = netWorth;
            state.history[currentMonthStr].totalAssets = totalAssets;

            document.getElementById('lbl-total-assets').textContent = formatRp(totalAssets);
            const nwEl = document.getElementById('global-net-worth');
            nwEl.textContent = formatRp(netWorth);
            nwEl.className = `font-display text-[clamp(2.5rem,5vw,4rem)] font-bold tracking-tight mb-8 mask-data break-words leading-tight ${netWorth < 0 ? 'text-red-500' : 'text-slate-900 dark:text-white'}`;
            
            const debtIn = document.getElementById('input-debt');
            if(document.activeElement !== debtIn) debtIn.value = debt === 0 ? '' : debt.toLocaleString('id-ID');

            /* Skor Kesehatan: Rasio Hutang */
            const debtRatio = totalAssets > 0 ? (debt / totalAssets) * 100 : (debt > 0 ? 100 : 0);
            document.getElementById('health-debt-txt').textContent = `${debtRatio.toFixed(1)}%`;
            const hb = document.getElementById('health-debt-bar');
            const hs = document.getElementById('health-debt-status');
            hb.style.width = `${Math.min(debtRatio, 100)}%`;
            
            if(debtRatio <= 30) { hb.className = 'h-full bg-success transition-all duration-700 ease-out'; hs.textContent = 'Status: Aman'; hs.className = 'text-[10px] font-bold text-success mt-1.5 text-right uppercase tracking-wider'; }
            else if(debtRatio <= 50) { hb.className = 'h-full bg-warning transition-all duration-700 ease-out'; hs.textContent = 'Status: Hati-hati'; hs.className = 'text-[10px] font-bold text-warning mt-1.5 text-right uppercase tracking-wider'; }
            else { hb.className = 'h-full bg-danger transition-all duration-700 ease-out'; hs.textContent = 'Status: Beban Tinggi'; hs.className = 'text-[10px] font-bold text-danger mt-1.5 text-right uppercase tracking-wider'; }

            /* Skor Kesehatan: Diversifikasi */
            const dCount = Object.keys(diversData).filter(k => diversData[k] > 0).length;
            document.getElementById('health-div-txt').textContent = `${dCount} Kategori`;
            const divSteps = document.getElementById('health-div-steps');
            divSteps.innerHTML = '';
            for(let i=0; i<5; i++) {
                const color = i < dCount ? (dCount >= 3 ? 'bg-success' : 'bg-warning') : 'bg-slate-200 dark:bg-slate-700';
                divSteps.innerHTML += `<div class="flex-1 rounded-full ${color} transition-colors duration-500"></div>`;
            }

            renderTrendChart();
        };

        const attachInput = (el, cb, unit) => {
            el.addEventListener('input', function() {
                if(unit.includes('IDR') || unit === 'TARGET') {
                    let raw = this.value.replace(/\D/g, '');
                    if(!raw) { this.value = ''; cb(0); } else {
                        let num = parseInt(raw, 10);
                        this.value = num.toLocaleString('id-ID');
                        cb(num);
                    }
                } else {
                    let raw = this.value.replace(/[^0-9.]/g, '');
                    this.value = raw; cb(parseFloat(raw) || 0);
                }
                saveSilent(); updateDynamicValues();
            });
        };

        window.toggleGoal = (gIdx) => {
            const goals = state.history[currentMonthStr].goals;
            goals[gIdx].collapsed = !goals[gIdx].collapsed;
            saveSilent();
            document.getElementById(`gc-${gIdx}`).classList.toggle('is-collapsed', goals[gIdx].collapsed);
        };

        const renderUI = () => {
            const container = document.getElementById('goals-container');
            container.innerHTML = '';
            const goals = state.history[currentMonthStr].goals;

            goals.forEach((goal, gIdx) => {
                const card = document.createElement('div');
                card.id = `gc-${gIdx}`;
                card.className = `minimal-card ${goal.collapsed ? 'is-collapsed' : ''}`;
                
                let assetsHtml = goal.assets.length === 0 ? `<div class="text-center text-xs text-slate-400 py-3 font-medium">Belum ada aset ditambahkan.</div>` : 
                    goal.assets.map((a, aIdx) => {
                        const v = a.unit.includes('IDR') ? (a.amount ? a.amount.toLocaleString('id-ID') : '') : (a.amount || '');
                        return `
                        <div class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-800 group transition-colors hover:border-slate-300 dark:hover:border-slate-600">
                            <i data-lucide="${ICONS[a.unit] || 'wallet'}" class="w-5 h-5 text-slate-400 flex-shrink-0"></i>
                            <div class="flex-1 flex flex-col sm:flex-row gap-2 sm:items-center">
                                <input type="text" class="asset-name bg-transparent border-none text-sm font-bold text-slate-700 dark:text-slate-300 outline-none w-full sm:w-1/3" value="${a.name}" placeholder="Nama Catatan..." data-g="${gIdx}" data-a="${aIdx}">
                                <div class="flex items-center flex-1 gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-1 pr-2">
                                    <input type="text" class="asset-amount bg-transparent border-none text-sm font-bold text-slate-900 dark:text-white outline-none w-full text-right px-2 mask-data" inputmode="${a.unit.includes('IDR')?'numeric':'decimal'}" value="${v}" placeholder="0" data-g="${gIdx}" data-a="${aIdx}" data-u="${a.unit}">
                                    <select class="asset-unit text-xs font-bold bg-transparent outline-none text-slate-500 w-[100px] cursor-pointer" data-g="${gIdx}" data-a="${aIdx}">
                                        ${UNITS.map(u => `<option value="${u}" ${a.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="flex flex-col items-end gap-1 flex-shrink-0 min-w-[70px]">
                                <button class="btn-del-asset text-slate-400 hover:text-red-500 transition-colors p-1" data-g="${gIdx}" data-a="${aIdx}"><i data-lucide="x" class="w-4 h-4"></i></button>
                                <div class="text-[10px] font-bold text-slate-400 mask-data text-right" id="equiv-${gIdx}-${aIdx}"></div>
                            </div>
                        </div>`;
                    }).join('');

                card.innerHTML = `
                    <div class="goal-header-toggle p-5 sm:p-6 border-b-2 border-slate-100 dark:border-slate-800 cursor-pointer user-select-none hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors rounded-t-[2rem]" data-g="${gIdx}">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                            <div class="flex-1 w-full">
                                <input type="text" class="goal-name w-full bg-transparent border-none outline-none font-display font-bold text-xl text-slate-900 dark:text-white placeholder-slate-300 focus:border-b-2 focus:border-accent" value="${goal.name}" placeholder="Nama Tujuan..." data-g="${gIdx}">
                            </div>
                            <div class="flex items-center gap-3 w-full sm:w-auto">
                                <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 w-full sm:w-auto">
                                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Target:</span>
                                    <span class="font-display font-bold text-sm text-slate-900 dark:text-white">Rp</span>
                                    <input type="text" class="goal-target bg-transparent border-none outline-none font-display font-bold text-sm text-slate-900 dark:text-white w-24 text-right mask-data focus:ring-0 p-0" inputmode="numeric" value="${goal.target ? goal.target.toLocaleString('id-ID') : ''}" placeholder="0" data-g="${gIdx}">
                                </div>
                                <button class="btn-collapse text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-transform pointer-events-none"><i data-lucide="chevron-up" class="w-5 h-5 pointer-events-none"></i></button>
                            </div>
                        </div>
                        <div class="relative h-4 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700">
                            <div id="prog-${gIdx}" class="h-full bg-gradient-to-r from-accent to-blue-600 transition-all duration-700 ease-out" style="width: 0%"></div>
                        </div>
                        <div class="flex justify-between items-center mt-3">
                            <div class="text-xs font-bold text-slate-500" id="col-txt-${gIdx}">Terkumpul: Rp 0</div>
                            <div class="text-[11px] font-bold bg-accent/10 text-accent px-2.5 py-1 rounded-lg" id="pct-txt-${gIdx}">0%</div>
                        </div>
                    </div>
                    <div class="goal-body p-5 sm:p-6 pt-2 bg-white dark:bg-slate-900 rounded-b-[2rem]">
                        <div>
                            <div class="flex justify-between items-center mb-4 mt-2">
                                <div class="text-[11px] font-bold uppercase tracking-widest text-slate-400 flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4"></i> Rincian Aset</div>
                                <button class="btn-del-goal text-slate-400 hover:text-red-500 transition-colors p-2 rounded-xl hover:bg-red-50 dark:hover:bg-red-500/10" data-g="${gIdx}" title="Hapus Kantong"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                            </div>
                            <div class="flex flex-col gap-3 mb-4">${assetsHtml}</div>
                            <button class="btn-add-asset w-full py-3 rounded-xl border-2 border-dashed border-slate-200 dark:border-slate-700 text-slate-500 hover:text-accent hover:border-accent hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all font-bold text-sm flex justify-center items-center gap-2" data-g="${gIdx}">
                                <i data-lucide="plus" class="w-4 h-4"></i> Tambah Catatan Aset
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Mengikat event listener input setelah DOM selesai dirender
            document.querySelectorAll('.goal-name').forEach(el => el.addEventListener('blur', e => { goals[e.target.dataset.g].name = e.target.value; saveAndRender(); }));
            document.querySelectorAll('.goal-target').forEach(el => attachInput(el, (v) => { goals[el.dataset.g].target = v; }, 'TARGET'));
            document.querySelectorAll('.asset-name').forEach(el => el.addEventListener('blur', e => { goals[e.target.dataset.g].assets[e.target.dataset.a].name = e.target.value; saveAndRender(); }));
            document.querySelectorAll('.asset-unit').forEach(el => el.addEventListener('change', e => { goals[e.target.dataset.g].assets[e.target.dataset.a].unit = e.target.value; saveAndRender(); }));
            document.querySelectorAll('.asset-amount').forEach(el => attachInput(el, (v) => { goals[e.target.dataset.g].assets[e.target.dataset.a].amount = v; }, el.dataset.u));

            document.querySelectorAll('.btn-add-asset').forEach(el => {
                el.addEventListener('click', e => { 
                    const gIdx = parseInt(e.currentTarget.dataset.g, 10);
                    goals[gIdx].assets.push({ id: Date.now(), name: '', unit: 'IDR / Tabungan', amount: 0 }); 
                    saveAndRender(); 
                });
            });
            
            // Handle Toggle Card Collapse
            document.querySelectorAll('.goal-header-toggle').forEach(el => {
                el.addEventListener('click', e => {
                    // Mencegah collapse jika sedang klik di dalam input text
                    if(e.target.tagName === 'INPUT') return;
                    
                    const gIdx = parseInt(el.dataset.g, 10);
                    goals[gIdx].collapsed = !goals[gIdx].collapsed;
                    saveSilent();
                    
                    const card = document.getElementById(`gc-${gIdx}`);
                    if (card) card.classList.toggle('is-collapsed', goals[gIdx].collapsed);
                });
            });

            document.querySelectorAll('.btn-del-goal').forEach(el => {
                el.addEventListener('click', e => {
                    e.stopPropagation(); // Mencegah trigger ke fungsi lain
                    const gIdx = parseInt(e.currentTarget.dataset.g, 10);
                    showDialog('Hapus Kantong Tabungan', 'Apakah Anda yakin ingin menghapus kantong tabungan ini beserta seluruh catatan aset di dalamnya?', 'danger', () => {
                        const currentGoals = state.history[currentMonthStr].goals;
                        currentGoals.splice(gIdx, 1);
                        saveAndRender();
                    });
                });
            });

            // Ensure dataset uses ints for splicing assets
            document.querySelectorAll('.btn-del-asset').forEach(el => {
                el.addEventListener('click', e => {
                    e.stopPropagation();
                    const gIdx = parseInt(e.currentTarget.dataset.g, 10);
                    const aIdx = parseInt(e.currentTarget.dataset.a, 10);
                    const currentGoals = state.history[currentMonthStr].goals;
                    currentGoals[gIdx].assets.splice(aIdx, 1);
                    saveAndRender();
                });
            });

            window.lucide.createIcons();
            updateDynamicValues();
        };

        document.getElementById('btn-add-goal').addEventListener('click', () => {
            state.history[currentMonthStr].goals.push({ id: Date.now(), name: '', target: 0, collapsed: false, assets: [] });
            saveAndRender();
            setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
        });

        // First Render
        document.getElementById('theme-icon').setAttribute('data-lucide', state.theme === 'light' ? 'moon' : 'sun');
        document.getElementById('btn-privacy').innerHTML = `<i data-lucide="${state.privacy ? 'eye-off' : 'eye'}"></i>`;
        renderUI();

    </script>
</body>
</html>
